[package]
name = "joaju-table"
version = "0.1.0"
edition = "2021"
description = "Gerador soberano em Rust de tabelas acadêmicas ABNT/IBGE/APA de 3 linhas em Typst"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-table"
homepage = "https://codeberg.org/lumenpink/joaju-table"
documentation = "https://docs.rs/joaju-table"
readme = "README.md"
keywords = ["typst", "table", "abnt", "ibge", "academic"]
categories = ["text-processing", "rendering", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
joaju-csv = { version = "0.1.0", path = "../joaju-csv" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "joaju-table"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "joaju_table"
path = "src/lib.rs"
