[package]
name = "table-rs"
version = "0.1.0-dev.1"
edition = "2021"
description = "Gerador soberano em Rust de tabelas acadêmicas ABNT/IBGE/APA de 3 linhas em Typst"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/table-rs"
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
ssot-rs = { path = "../ssot-rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "table-rs"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "table_rs"
path = "src/lib.rs"
