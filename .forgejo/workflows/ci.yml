name: CI, Quality & GitOps Cascade

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-test:
    name: "Rust — Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          rustup component add rustfmt clippy 2>/dev/null || true

      - name: "Configure Cargo Registries"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          TOKEN="${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "Bearer %s"\n' "$TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit GitOps Cascade Integration"
        run: bash tests/audit_gitops_cascade.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi

  publish-and-cascade:
    name: "Publish Canonical Crate & Cascade Downstream"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Determine Release Channel and Alias"
        id: channel
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "alias=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "alias=latest-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "★ Canal: $(cat $GITHUB_OUTPUT)"

      - name: "Configure Cargo Credentials"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          TOKEN="${REGISTRY_TOKEN}"
          if [ -n "$TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "Bearer %s"\n' "$TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Publish Crate to Gambi Registry"
        run: |
          CANONICAL_VERSION=$(head -n 1 VERSION | tr -d ' \r\n')
          echo "-> Sincronizando Cargo.toml para a versao canonica: $CANONICAL_VERSION"
          sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
          echo "-> Publicando joaju-table no registry gambi..."
          cargo publish --registry gambi --allow-dirty || echo "::warning::Versao ja publicada ou falha tolerada no registry."

      - name: "Notify Kombinat Daemon of Release Cascade"
        run: |
          VERSION=$(head -n 1 VERSION | cut -d'+' -f1 | tr -d ' \r\n')
          echo "★ Notificando Kombinat da publicação de joaju-table@${VERSION}..."
          curl -s -X POST http://127.0.0.1:4040/api/cascade/dispatch \
            -H "Content-Type: application/json" \
            -d "{\"package\": \"joaju-table\", \"version\": \"${VERSION}\"}" || curl -s -X POST http://172.17.0.1:4040/api/cascade/dispatch \
            -H "Content-Type: application/json" \
            -d "{\"package\": \"joaju-table\", \"version\": \"${VERSION}\"}" || {
            echo "::warning::Falha ao contatar Kombinat daemon em 127.0.0.1:4040 ou 172.17.0.1:4040. Continuando sem abortar CI."
          }
